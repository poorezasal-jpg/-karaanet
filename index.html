<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="راه‌های ارتباط با KARAANET در شبکه‌های اجتماعی">
  <title>KARAANET | شبکه‌های اجتماعی</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
      color: #ffffff;
      /* پس‌زمینه گرادیانت برای نمایش بهتر حالت شیشه‌ای */
      background: radial-gradient(circle at top left, #3b82f6, transparent 45%),
                  radial-gradient(circle at bottom right, #8b5cf6, transparent 45%),
                  linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      overflow-x: hidden;
    }

    /* دایره‌های نوری پس‌زمینه برای عمق دادن به شیشه */
    body::before, body::after {
      content: "";
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.6;
    }
    body::before {
      background: #06b6d4;
      top: 10%;
      right: 15%;
    }
    body::after {
      background: #ec4899;
      bottom: 10%;
      left: 15%;
    }

    /* کارت اصلی با افکت شیشه‌ای */
    main {
      width: min(100%, 420px);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      border-left: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 28px;
      padding: 36px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .mark {
      width: 78px;
      height: 78px;
      margin: 0 auto 16px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      letter-spacing: 1.5px;
      direction: ltr;
      font-weight: 800;
    }

    p {
      margin-bottom: 28px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      line-height: 1.8;
    }

    nav {
      display: grid;
      gap: 13px;
    }

    /* دکمه‌های شیشه‌ای */
    a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
    }

    a:hover, a:focus {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      outline: none;
    }

    a:active {
      transform: translateY(0);
    }

    footer {
      margin-top: 26px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">K</div>
    <h1>KARAANET</h1>
    <p>از طریق شبکه اجتماعی موردنظرت با ما در ارتباط باش</p>
    <nav aria-label="شبکه‌های اجتماعی">
      <a href="https://instagram.com/motionmmd" target="_blank" rel="noopener noreferrer">اینستاگرام</a>
      <a href="https://t.me/karaanet" target="_blank" rel="noopener noreferrer">تلگرام</a>
      <a href="https://rubika.ir/karaanet" target="_blank" rel="noopener noreferrer">روبیکا</a>
      <a href="https://web.eitaa.com/karaanet" target="_blank" rel="noopener noreferrer">ایتا</a>
      <a href="https://web.bale.ai/karaanet" target="_blank" rel="noopener noreferrer">بله</a>
    </nav>
    <footer>با انتخاب هر گزینه وارد صفحه مربوطه می‌شوید.</footer>
  </main>
</body>
</html>
